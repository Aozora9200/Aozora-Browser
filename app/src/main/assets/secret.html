<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <title>スタートページ</title>
  <style>
    /* 既存のスタイル */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column; /* ← 縦方向に積む */
      justify-content: flex-start; /* 上から配置 */
      align-items: center;  /* 中央揃え */
      min-height: 100vh;    /* 縦スクロール対応 */
      font-family: "Comic Sans MS", cursive, sans-serif;
      position: relative;
      animation: bgShift 20s ease-in-out infinite;
      background-attachment: fixed;
      -webkit-animation: bgShift 20s ease-in-out infinite;
}
    @keyframes bgShift {
      0%   { filter: hue-rotate(0deg) contrast(1); }
      50%  { filter: hue-rotate(20deg) contrast(1.1); }
      100% { filter: hue-rotate(0deg) contrast(1); }
    }
    @-webkit-keyframes bgShift {
      0%   { -webkit-filter: hue-rotate(0deg) contrast(1); }
      50%  { -webkit-filter: hue-rotate(20deg) contrast(1.1); }
      100% { -webkit-filter: hue-rotate(0deg) contrast(1); }
    }

    /* ===== 追加：検索ボックス/エンジン選択/ニュース/壁紙用のガラス風デザイン変数 ===== */
    :root{
      --accent:#2f8fd1;
      --accent-strong:#17618f;
      --glass:rgba(255,255,255,.58);
      --glass-strong:rgba(255,255,255,.82);
      --glass-border:rgba(255,255,255,.75);
      --shadow:0 10px 28px rgba(23,97,143,.14);
      --ink:#12314a;
      --ink-soft:#4c6c82;
      --bg-overlay: linear-gradient(to bottom, rgba(255,255,255,.3) 0%, rgba(255,255,255,.7) 75%, #fff 100%);
    }

    /* ===== ライトモード（通常） ===== */
    .masthead h1, .masthead .h1 {
      background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
    }
    body {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.7) 75%, #fff 100%), url("assets/img/bg-masthead.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      background-size: cover;
      color: #000;
    }
    #logo {
      color: #000000;
    }
    .icon-grid a {
      color: black;
    }

    #bgOverlay {
          background: rgba(255,255,255,0.3);
        }
    /* ===== ダークモード ===== */
    @media (prefers-color-scheme: dark) {
        :root{
          --accent:#6cc0f2;
          --accent-strong:#9ddaf6;
          --glass:rgba(13,33,50,.55);
          --glass-strong:rgba(13,33,50,.78);
          --glass-border:rgba(255,255,255,.10);
          --shadow:0 10px 30px rgba(0,0,0,.4);
          --ink:#e7f3fb;
          --ink-soft:#a4c4d8;
          --bg-overlay: linear-gradient(to bottom, rgba(0,0,0,.3) 0%, rgba(0,0,0,.7) 75%, #000 100%);
        }
        .masthead h1, .masthead .h1 {
          background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
        }
        body {
          background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.7) 75%, #000 100%), url("assets/img/bg-masthead.jpg");
          background-position: center;
          background-repeat: no-repeat;
          background-attachment: scroll;
          background-size: cover;
          color: #fff;
        }
        #logo {
          color: #ffffff;
        }
        .icon-grid a {
          color: white;
        }
        #bgOverlay {
          background: rgba(0,0,0,0.3);
        }
    }

    .masthead {
  position: relative;
  width: 100%;
  height: auto;
  animation: fadeInUp 1s ease-out;
  -webkit-animation: fadeInUp 1s ease-out;
  min-height: 35rem;
  padding: 15rem 0;
}
.masthead h1, .masthead .h1 {
  font-family: "Varela Round", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  font-size: 2.5rem;
  line-height: 2.5rem;
  letter-spacing: 0.8rem;
  margin-top: 20px;
  -webkit-text-fill-color: transparent;
  -webkit-background-clip: text;
          background-clip: text;
}
.masthead h2, .masthead .h2 {
  max-width: 20rem;
  font-size: 1rem;
}
@media (min-width: 768px) {
  .masthead h1, .masthead .h1 {
    font-size: 4rem;
    line-height: 4rem;
  }
}
@media (min-width: 992px) {
  .masthead {
    height: 100vh;
    padding: 0;
  }
  .masthead h1, .masthead .h1 {
    font-size: 6.5rem;
    line-height: 6.5rem;
    letter-spacing: 0.8rem;
  }
  .masthead h2, .masthead .h2 {
    max-width: 30rem;
    font-size: 1.25rem;
  }
}

    .container {
  display: flex;
  flex-direction: column;  /* 縦に並べる */
  align-items: center;     /* 中央寄せ */
  z-index: 10;
  animation: fadeInUp 1s ease-out;
  -webkit-animation: fadeInUp 1s ease-out;
  width: 100%;             /* 追加：横幅いっぱい */
  max-width: 500px;        /* 追加：横幅を制限 */
  margin: 0 auto;          /* 追加：中央寄せ */
}
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @-webkit-keyframes fadeInUp {
      from { opacity: 0; -webkit-transform: translateY(20px); }
      to { opacity: 1; -webkit-transform: translateY(0); }
    }
    #logo {
      font-size: 30px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.5s ease;
    }
    @keyframes rotateLogo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @-webkit-keyframes rotateLogo {
      from { -webkit-transform: rotate(0deg); }
      to { -webkit-transform: rotate(360deg); }
    }
    form { text-align: center; }

    /* ===== 検索ボックス（ガラス風デザイン） ===== */
    .search-field{
      position: relative;
      display: flex;
      align-items: center;
      width: 80vw;
      max-width: 340px;
      margin: 0 auto;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 4px 4px 4px 20px;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
      z-index: 25; /* ← これを追加 */
    }
    .search-field:focus-within{
      box-shadow: 0 12px 32px rgba(47,143,209,.28);
      transform: translateY(-1px);
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      padding: 10px 0;
    }
    input[type="text"]::placeholder { color: var(--ink-soft); }
    #goButton {
      flex-shrink: 0;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    #goButton:hover {
      background: var(--accent-strong);
    }
    #goButton:active {
      transform: scale(0.96);
    }
    .suggest-box {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      width: auto;
      margin-top: 0;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      list-style: none;
      padding: 0;
      overflow: hidden;
      z-index: 99;
      display: none;
      font-size: 14px;
    }
    .suggest-box li {
      padding: 11px 18px;
      cursor: pointer;
      color: var(--ink);
      transition: background 0.15s ease;
    }
    .suggest-box li:hover {
      background: rgba(47,143,209,.14);
    }

    /* ===== 検索エンジン選択 ===== */
    .engine-row{
      position: relative;
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }
    #engineToggle {
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.02em;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s ease;
      z-index: 20;
    }
    #engineToggle:hover {
      color: var(--accent-strong);
    }
    #engineToggle svg{
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
    }
    #engineToggle[aria-expanded="true"] svg{
      transform: rotate(180deg);
    }
    #engineSelector {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      flex-direction: column;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px;
      gap: 4px;
      z-index: 20;
      min-width: 170px;
    }
    #engineSelector button {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      margin: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #engineSelector button:hover {
      background: rgba(47,143,209,.15);
      transform: none;
    }
    #notification {
      display: none;
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-strong);
      color: var(--ink);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 20px;
      border-radius: 999px;
      z-index: 30;
      font-size: 13px;
      box-shadow: var(--shadow);
    }

    .fluffy {
      position: absolute;
      pointer-events: none;
      animation-fill-mode: forwards;
      animation-timing-function: ease-in-out;
      will-change: transform, opacity;
    }
    .fluffy.snow { animation-name: floatSnow; -webkit-animation-name: floatSnow; }
    @keyframes floatSnow {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    @-webkit-keyframes floatSnow {
      0% { -webkit-transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { -webkit-transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    .fluffy.feather { animation-name: floatFeather; -webkit-animation-name: floatFeather; }
    @keyframes floatFeather {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(20vw) rotate(30deg); opacity: 0; }
    }
    @-webkit-keyframes floatFeather {
      0% { -webkit-transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      100% { -webkit-transform: translateY(-100vh) translateX(20vw) rotate(30deg); opacity: 0; }
    }
    .fluffy.petal { animation-name: floatPetal; -webkit-animation-name: floatPetal; }
    @keyframes floatPetal {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      50% { transform: translateY(50vh) translateX(10vw) rotate(15deg); }
      100% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
    }
    @-webkit-keyframes floatPetal {
      0% { -webkit-transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      50% { -webkit-transform: translateY(50vh) translateX(10vw) rotate(15deg); }
      100% { -webkit-transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
    }
    .fluffy.bubble { animation-name: floatBubble; -webkit-animation-name: floatBubble; }
    @keyframes floatBubble {
      0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    @-webkit-keyframes floatBubble {
      0% { -webkit-transform: translateY(0) scale(0.5); opacity: 0.8; }
      100% { -webkit-transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    .fluffy.leaf { animation-name: floatLeaf; -webkit-animation-name: floatLeaf; }
    @keyframes floatLeaf {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(100vh) translateX(-10vw) rotate(360deg); opacity: 0; }
    }
    @-webkit-keyframes floatLeaf {
      0% { -webkit-transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
      100% { -webkit-transform: translateY(100vh) translateX(-10vw) rotate(360deg); opacity: 0; }
    }
    .fluffy.star { animation-name: floatStar; -webkit-animation-name: floatStar; }
    @keyframes floatStar {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-50vh) scale(1.5); opacity: 0; }
    }
    @-webkit-keyframes floatStar {
      0% { -webkit-transform: translateY(0) scale(1); opacity: 0.8; }
      100% { -webkit-transform: translateY(-50vh) scale(1.5); opacity: 0; }
    }
    .fluffy.cloud { animation-name: floatCloud; -webkit-animation-name: floatCloud; }
    @keyframes floatCloud {
      0% { transform: translateX(0) scale(1); opacity: 0.6; }
      100% { transform: translateX(50vw) scale(1.2); opacity: 0; }
    }
    @-webkit-keyframes floatCloud {
      0% { -webkit-transform: translateX(0) scale(1); opacity: 0.6; }
      100% { -webkit-transform: translateX(50vw) scale(1.2); opacity: 0; }
    }
    .fluffy.sparkle { animation-name: floatSparkle; -webkit-animation-name: floatSparkle; }
    @keyframes floatSparkle {
      0% { transform: scale(0); opacity: 1; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
    @-webkit-keyframes floatSparkle {
      0% { -webkit-transform: scale(0); opacity: 1; }
      50% { -webkit-transform: scale(1); opacity: 1; }
      100% { -webkit-transform: scale(0); opacity: 0; }
    }
    .fluffy.bird {
      animation-name: floatBird;
      -webkit-animation-name: floatBird;
      animation-timing-function: linear;
      -webkit-animation-timing-function: linear;
    }
    @keyframes floatBird {
      0% { transform: translate(-20vw, 0); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate(50vw, -5vh); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(120vw, 0); opacity: 0; }
    }
    @-webkit-keyframes floatBird {
      0% { -webkit-transform: translate(-20vw, 0); opacity: 0; }
      10% { opacity: 1; }
      50% { -webkit-transform: translate(50vw, -5vh); opacity: 1; }
      90% { opacity: 1; }
      100% { -webkit-transform: translate(120vw, 0); opacity: 0; }
    }

    /* アイコン一覧 */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
      padding: 0 10px;
    }
    .icon-grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      font-size: 12px;
      transition: transform 0.2s ease;
    }
    .icon-grid a:hover {
      transform: scale(1.1);
    }
    .icon-grid img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    /* ===== 追加：サイト追加機能 ===== */
    .icon-tile {
      position: relative;
    }
    .icon-tile .remove-site {
      display: none;
      position: absolute;
      top: -6px;
      right: 8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      color: var(--ink);
      font-size: 12px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 5;
    }
    .icon-tile.editing .remove-site {
      display: block;
    }
    #addSiteBtn {
      cursor: pointer;
    }
    #addSiteBtn .add-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass);
      border: 1px dashed var(--glass-border);
      font-size: 20px;
      color: var(--ink-soft);
    }
    #siteModalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #siteModal {
      width: 82vw;
      max-width: 320px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 20px;
      color: var(--ink);
    }
    #siteModal h3 {
      font-family: "Varela Round", sans-serif;
      font-size: 15px;
      margin-bottom: 14px;
      color: var(--accent-strong);
    }
    #siteModal label {
      display: block;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    #siteModal input[type="text"],
    #siteModal input[type="url"] {
      width: 100%;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,.5);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--ink);
      margin-bottom: 12px;
      outline: none;
    }
    #siteModalPreview {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--ink-soft);
    }
    #siteModalPreview img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #fff;
    }
    #siteModalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    #siteModalActions button {
      border: none;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    #siteModalCancel {
      background: transparent;
      color: var(--ink-soft);
    }
    #siteModalSave {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    #siteModalSave:hover {
      background: var(--accent-strong);
    }
    #siteModalError {
      display: none;
      font-size: 12px;
      color: #c0392b;
      margin-bottom: 10px;
    }

    /* ===== ニュース一覧（ガラス風カード） ===== */
    #news {
      margin: 25px auto 0;
      width: 90vw;
      max-width: 600px;
      font-size: 14px;
    }
    #news .section-title {
      font-family: "Varela Round", sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-strong);
      margin-bottom: 12px;
      padding-left: 4px;
    }
    #news ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #news li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px;
      transition: background 0.18s ease;
    }
    #news li:hover {
      background: var(--glass-strong);
    }
    #news img {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: #fff;
    }
    #news a {
      text-decoration: none;
      line-height: 1.5;
      font-size: 14px;
      display: block;
      color: var(--ink);
    }
    #news a:hover {
      text-decoration: underline;
      color: var(--accent-strong);
    }

    /* ===== 壁紙を設定（ガラス風ボタン） ===== */
    #bgContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 40px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .ghost-btn {
      display: inline-block;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--accent-strong);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

<script>
  const patterns = ['snow', 'feather', 'petal', 'bubble', 'leaf', 'star', 'cloud', 'sparkle'];

  function createBird() {

    setTimeout(function() { div.remove(); }, duration * 1000);

  function scheduleBird() {

  scheduleBird();
  const inputField = document.querySelector('input[type="text"]');

  // 検索エンジン選択機能
  const searchEngines = {

  };
  const engineToggle = document.getElementById('engineToggle');

  const notification = document.getElementById('notification');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');

  // フォーム送信時、検索欄が空なら送信をキャンセル
  searchForm.addEventListener('submit', function(e) {
    if (!searchInput.value.trim()) {
      e.preventDefault();

  engineToggle.addEventListener('click', () => {
    const isOpen = engineSelector.style.display === 'flex';

  engineSelector.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      const engineKey = button.getAttribute('data-engine');

        const engine = searchEngines[engineKey];

        searchInput.name = engine.param;

        notification.textContent = engineKey + " に変更しました";

  const suggestBox = document.getElementById('suggestions');
let debounceTimer;

searchInput.addEventListener('input', () => {
const query = searchInput.value.trim();
clearTimeout(debounceTimer);
if (query.length === 0) {
  suggestBox.style.display = 'none';
  return;
}

debounceTimer = setTimeout(() => {
  fetch(`https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      const suggestions = data[1];
      if (suggestions.length === 0) {
        suggestBox.style.display = 'none';

      suggestBox.innerHTML = '';
      suggestions.forEach(word => {

          searchInput.value = word;

}, 300);
});

document.addEventListener('click', (e) => {
if (!searchInput.contains(e.target) && !suggestBox.contains(e.target)) {
  suggestBox.style.display = 'none';

});

  function loadNews() {

loadNews();

  const bgSelector = document.getElementById('bgSelector');
  const bgClear = document.getElementById('bgClear');
  const MAX_SIZE_LOWER = 2 * 1024 * 1024;
  const MAX_SIZE_UPPER = 8 * 1024 * 1024;

  addEventListener('DOMContentLoaded', () => {
    const savedBg = localStorage.getItem('bgImage');
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (isDark) {
      // 🌙 ダークモードのときの背景
      if (savedBg) document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.7) 75%, #000 100%), url(${savedBg})`;
    } else {
      // ☀ ライトモードのときの背景
      if (savedBg) document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.7) 75%, #fff 100%), url(${savedBg})`;
    }
  });

  bgSelector.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file || file.size > MAX_SIZE_UPPER) {
      if (file && file.size > MAX_SIZE_UPPER) alert("8MBを超える画像はサポートしていません。");
      return;
    }

    const reader = new FileReader();
    reader.onload = event => {
      const dataUrl = event.target.result;
      const applyBackground = (url) => {
        localStorage.setItem('bgImage', url);
        disableAutoWallpaper();
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDark) {
          // 🌙 ダークモードのときの背景
          document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.7) 75%, #000 100%), url(${url})`;
        } else {
          // ☀ ライトモードのときの背景
          document.body.style.background = `linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.7) 75%, #fff 100%), url(${url})`;
        }
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
    };

      if (file.size > MAX_SIZE_LOWER) {
        const img = new Image();
        img.onload = () => {
          const ratio = Math.sqrt(MAX_SIZE_LOWER / file.size);
          const targetWidth = Math.floor(img.width * ratio);
          const targetHeight = Math.floor(img.height * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = targetWidth;
          canvas.height = targetHeight;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
          const optimizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          applyBackground(optimizedDataUrl);
        };
        img.src = dataUrl;
      } else {
        applyBackground(dataUrl);
      }
    };

    reader.readAsDataURL(file);
  });

  bgClear.addEventListener('click', () => {
      localStorage.removeItem('bgImage');
      document.body.style.background = '';
      enableAutoWallpaper(true);
  });

  // ===== 追加：サイト追加機能 =====
  const CUSTOM_SITES_KEY = 'customSites';
  const iconGrid = document.getElementById('iconGrid');
  const addSiteBtn = document.getElementById('addSiteBtn');
  const editSitesBtn = document.getElementById('editSitesBtn');
  const siteModalOverlay = document.getElementById('siteModalOverlay');
  const siteNameInput = document.getElementById('siteNameInput');
  const siteUrlInput = document.getElementById('siteUrlInput');
  const siteModalPreview = document.getElementById('siteModalPreview');
  const siteModalPreviewImg = document.getElementById('siteModalPreviewImg');
  const siteModalPreviewText = document.getElementById('siteModalPreviewText');
  const siteModalCancel = document.getElementById('siteModalCancel');
  const siteModalSave = document.getElementById('siteModalSave');
  const siteModalError = document.getElementById('siteModalError');
  let editMode = false;

  function getCustomSites() {
    try {
      return JSON.parse(localStorage.getItem(CUSTOM_SITES_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveCustomSites(sites) {
    localStorage.setItem(CUSTOM_SITES_KEY, JSON.stringify(sites));
  }

  // 入力されたURLからオリジン（サイトのトップURL）を安全に取り出す
  function normalizeUrl(raw) {
    let value = raw.trim();
    if (!value) return null;
    if (!/^https?:\/\//i.test(value)) {
      value = 'https://' + value;
    }
    try {
      const u = new URL(value);
      return u;
    } catch (e) {
      return null;
    }
  }

  // Googleのファビコン取得サービスを利用してアイコンURLを組み立てる
  function faviconUrlFor(origin) {
    return `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(origin)}&size=64`;
  }

  function renderCustomSites() {
    // 既存の追加サイトタイルを一旦削除して再描画
    iconGrid.querySelectorAll('.icon-tile').forEach(el => el.remove());
    const sites = getCustomSites();
    sites.forEach((site, index) => {
      const tile = document.createElement('a');
      tile.href = site.url;
      tile.className = 'icon-tile' + (editMode ? ' editing' : '');
      tile.innerHTML = `
        <span class="remove-site" data-index="${index}">×</span>
        <img src="${site.icon}" alt="">
        <span>${site.name}</span>
      `;
      if (editMode) {
        tile.addEventListener('click', (e) => e.preventDefault());
      }
      iconGrid.insertBefore(tile, addSiteBtn);
    });
    iconGrid.querySelectorAll('.remove-site').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const idx = parseInt(btn.getAttribute('data-index'), 10);
        const sites = getCustomSites();
        sites.splice(idx, 1);
        saveCustomSites(sites);
        renderCustomSites();
      });
    });
  }
  renderCustomSites();

  editSitesBtn.addEventListener('click', () => {
    editMode = !editMode;
    editSitesBtn.textContent = editMode ? '編集を終了' : 'サイトを編集';
    renderCustomSites();
  });

  function openSiteModal() {
    siteNameInput.value = '';
    siteUrlInput.value = '';
    siteModalPreview.style.display = 'none';
    siteModalError.style.display = 'none';
    siteModalOverlay.style.display = 'flex';
    setTimeout(() => siteNameInput.focus(), 50);
  }
  function closeSiteModal() {
    siteModalOverlay.style.display = 'none';
  }

  addSiteBtn.addEventListener('click', openSiteModal);
  siteModalCancel.addEventListener('click', closeSiteModal);
  siteModalOverlay.addEventListener('click', (e) => {
    if (e.target === siteModalOverlay) closeSiteModal();
  });

  // URL入力に応じてファビコンをプレビュー
  let previewDebounce;
  siteUrlInput.addEventListener('input', () => {
    clearTimeout(previewDebounce);
    previewDebounce = setTimeout(() => {
      const u = normalizeUrl(siteUrlInput.value);
      if (!u) {
        siteModalPreview.style.display = 'none';
        return;
      }
      siteModalPreviewImg.src = faviconUrlFor(u.origin);
      siteModalPreviewText.textContent = u.hostname;
      siteModalPreview.style.display = 'flex';
    }, 300);
  });

  siteModalSave.addEventListener('click', () => {
    const u = normalizeUrl(siteUrlInput.value);
    if (!u) {
      siteModalError.textContent = '正しいURLを入力してください。';
      siteModalError.style.display = 'block';
      return;
    }
    const name = siteNameInput.value.trim() || u.hostname;
    const sites = getCustomSites();
    sites.push({
      name: name,
      url: u.href,
      icon: faviconUrlFor(u.origin)
    });
    saveCustomSites(sites);
    renderCustomSites();
    closeSiteModal();
  });

  siteUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      siteModalSave.click();
    }
  });
  const WALLPAPER_FADE_MS = 2000; // フェード時間
  // hour から次の項目の hour まで有効。昇順で並べること（0:00〜4:00 は最後の枠が続く）
  const WALLPAPER_SCHEDULE = [
    { hour: 4,  src: 'assets/img/yugure.png' },      // 4:00〜6:00
    { hour: 6,  src: 'assets/img/bg-masthead.jpg' }, // 6:00〜16:00
    { hour: 16, src: 'assets/img/yugure.png' },      // 16:00〜18:00
    { hour: 18, src: 'assets/img/nightsky.png' }     // 18:00〜翌4:00
  ];

  const autoBgRoot = document.getElementById('autoBg');
  const autoLayers = [document.getElementById('bgLayerA'), document.getElementById('bgLayerB')];
  // body には filter アニメーションがあり、壁紙の色味や配置に影響するため <html> 直下へ移す
  document.documentElement.appendChild(autoBgRoot);
  autoBgRoot.style.setProperty('--wp-fade', WALLPAPER_FADE_MS + 'ms');

  let autoEnabled = false;
  let autoActive = 0;          // 前面にあるレイヤー番号
  let autoCurrentSrc = null;
  let autoLoadToken = 0;
  let autoTimer = null;
  let autoFadeTimer = null;
  let autoFadeInFirst = false; // 最初の1枚もフェードインさせるか

  function hasCustomWallpaper() {
    try { return !!localStorage.getItem('bgImage'); } catch (e) { return false; }
  }

  function getAutoWallpaper(date) {
    const h = date.getHours();
    let pick = WALLPAPER_SCHEDULE[WALLPAPER_SCHEDULE.length - 1];
    for (const e of WALLPAPER_SCHEDULE) if (h >= e.hour) pick = e;
    return pick.src;
  }

  function msUntilNextChange(now) {
    let min = Infinity;
    for (const e of WALLPAPER_SCHEDULE) {
      const t = new Date(now);
      t.setHours(e.hour, 0, 0, 0);
      if (t <= now) t.setDate(t.getDate() + 1);
      min = Math.min(min, t - now);
    }
    return min + 250;
  }

  // 進行中のフェードを即座に確定させる
  function finishAutoFade() {
    if (autoFadeTimer === null) return;
    clearTimeout(autoFadeTimer);
    autoFadeTimer = null;
    const cur = autoLayers[autoActive];
    const old = autoLayers[1 - autoActive];
    cur.style.transition = 'none';
    old.style.transition = 'none';
    old.classList.remove('visible');
    void old.offsetWidth;
    cur.style.transition = '';
    old.style.transition = '';
  }

  function swapAutoWallpaper(src) {
    finishAutoFade();
    const first = autoCurrentSrc === null;
    const prev = autoLayers[autoActive];
    const next = first ? prev : autoLayers[1 - autoActive];
    next.style.backgroundImage = `var(--bg-overlay), url("${src}")`;

    if (first) {
      if (!autoFadeInFirst) next.style.transition = 'none';
      void next.offsetWidth;
      next.classList.add('visible');
      if (!autoFadeInFirst) { void next.offsetWidth; next.style.transition = ''; }
      autoFadeInFirst = false;
    } else {
      // 新しい画像を前面に置いてフェードイン（下の旧画像は不透明のまま → 暗転しない）
      prev.style.zIndex = 1;
      next.style.zIndex = 2;
      void next.offsetWidth;
      next.classList.add('visible');
      autoActive = 1 - autoActive;
      autoFadeTimer = setTimeout(finishAutoFade, WALLPAPER_FADE_MS + 100);
    }
    autoCurrentSrc = src;
  }

  function showAutoWallpaper(src) {
    if (!autoEnabled || src === autoCurrentSrc) return;
    const token = ++autoLoadToken;
    const img = new Image();
    const proceed = (loaded) => {
      if (!autoEnabled || token !== autoLoadToken) return;
      // 読み込み失敗時は現状維持（次回の判定で再試行）。ただし最初の1枚だけはそのまま適用
      if (!loaded && autoCurrentSrc !== null) return;
      swapAutoWallpaper(src);
    };
    img.onload = () => proceed(true);
    img.onerror = () => proceed(false);
    img.src = src; // 読み込み完了後にフェード開始
  }

  function updateAutoWallpaper() {
    if (!autoEnabled) return;
    showAutoWallpaper(getAutoWallpaper(new Date()));
    clearTimeout(autoTimer);
    autoTimer = setTimeout(updateAutoWallpaper, msUntilNextChange(new Date()));
  }

  function enableAutoWallpaper(fadeIn = false) {
    autoEnabled = true;
    autoFadeInFirst = fadeIn && autoCurrentSrc === null;
    document.body.classList.add('auto-bg');
    autoBgRoot.classList.add('active');
    updateAutoWallpaper();
  }

  function disableAutoWallpaper() {
    autoEnabled = false;
    autoLoadToken++;
    clearTimeout(autoTimer); autoTimer = null;
    clearTimeout(autoFadeTimer); autoFadeTimer = null;
    document.body.classList.remove('auto-bg');
    autoBgRoot.classList.remove('active');
    autoLayers.forEach(l => {
      l.classList.remove('visible');
      l.style.backgroundImage = '';
      l.style.transition = '';
      l.style.zIndex = '';
    });
    autoActive = 0;
    autoCurrentSrc = null;
  }

  // バックグラウンドからの復帰時にも即座に判定（タイマーが止まっていても追従）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) updateAutoWallpaper();
  });

  if (!hasCustomWallpaper()) enableAutoWallpaper();
</script>
</body>
</html>
